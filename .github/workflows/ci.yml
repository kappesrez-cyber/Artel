name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prompool
          POSTGRES_PASSWORD: prompool
          POSTGRES_DB: prompool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prompool -d prompool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prompool:prompool@localhost:5432/prompool?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - name: Search tests on PostgreSQL
        run: npm run test:db
      - run: npm run build
      - name: Smoke test /api/health
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          echo "Health check failed" && exit 1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prompool:ci .
