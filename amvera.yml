# Конфигурация Amvera Cloud (https://amvera.ru): сборка по Dockerfile из корня репозитория.
# Переменные окружения (DATABASE_URL и др.) задаются в интерфейсе Amvera, см. README → «Хостинг на Amvera».
meta:
  environment: docker
  toolchain:
    name: docker
    version: latest
build:
  dockerfile: Dockerfile
  skip: false
run:
  containerPort: 3000
